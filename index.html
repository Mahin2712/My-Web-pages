<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #f472b6;
            --bg: #09090b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --glass: rgba(255, 255, 255, 0.05);
            --text: #fafafa;
            --text-muted: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            text-align: center;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--glass);
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-out;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, var(--primary), #ec4899);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            box-shadow: 0 0 30px rgba(244, 114, 182, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(244, 114, 182, 0.2);
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.75rem;
            color: #333;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="profile-img">
            <i class="fas fa-face-smile"></i>
        </div>
        <h1>Zareen Tasnim</h1>
        <p>Creative Mind • Explorer • (Kotha)</p>
        <a href="#" class="btn">Connect</a>
    </div>

    <footer>
        Hosted on zareen.apu.bd
    </footer>
</body>

</html>
