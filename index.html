<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(Mollah) Rafi Mustakim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #f59e0b; /* Amber */
            --bg: #111111;
            --surface: #1a1a1a;
            --text: #ffffff;
            --text-dim: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .profile-card {
            background: var(--surface);
            padding: 60px 40px;
            border-radius: 2px;
            border-left: 8px solid var(--primary);
            max-width: 450px;
            width: 90%;
            position: relative;
            box-shadow: 20px 20px 0px rgba(245, 158, 11, 0.05);
            animation: appear 0.6s ease-out;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: var(--primary);
            color: black;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 10px;
            line-height: 1;
        }

        .surname { color: var(--primary); }

        p {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .links {
            display: flex;
            gap: 25px;
        }

        .links a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.2s;
            border-bottom: 1px solid transparent;
        }

        .links a:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        footer {
            position: absolute;
            bottom: 40px;
            right: 40px;
            font-size: 0.8rem;
            color: #222;
            font-weight: 900;
            transform: rotate(-90deg);
            transform-origin: bottom right;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="badge">Official Profile</div>
        <h1><span class="surname">Mollah</span><br>Rafi Mustakim</h1>
        <p>Strategist • Creative • Leader</p>
        
        <div class="links">
            <a href="#">PORTFOLIO</a>
            <a href="#">CONTACT</a>
            <a href="#">RESUME</a>
        </div>
    </div>

    <footer>
        MOLLAH.BRO.BD
    </footer>
</body>
</html>
